<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12121e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#5a0000"/>
    </linearGradient>
    <linearGradient id="phantomGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#C0C0C0"/>
      <stop offset="60%" stop-color="#C0C0C0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C0C0C0" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ghostGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="8" y="8" width="496" height="496" rx="96" ry="96" fill="url(#bgGrad)"/>
  <!-- Crimson energy slash arc -->
  <path d="M 140 380 Q 256 200 372 120" stroke="url(#slashGrad)" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#glow)" opacity="0.6"/>
  <path d="M 155 400 Q 256 230 358 135" stroke="#8B0000" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#glow)" opacity="0.4"/>
  <!-- Left sword (jian) - crimson blade, pointing upper-right -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Blade -->
    <rect x="-8" y="-180" width="16" height="200" rx="2" fill="url(#bladeGrad)" filter="url(#glow)"/>
    <!-- Blade edge highlight -->
    <rect x="-6" y="-180" width="3" height="200" rx="1" fill="#a01020" opacity="0.6"/>
    <!-- Guard (horizontal bar) -->
    <rect x="-22" y="20" width="44" height="6" rx="2" fill="#c49a6c"/>
    <!-- Handle -->
    <rect x="-5" y="26" width="10" height="55" rx="2" fill="#2a1a1a"/>
    <!-- Handle wrap -->
    <rect x="-4" y="26" width="8" height="55" rx="2" fill="none" stroke="#c49a6c" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>
    <!-- Pommel -->
    <circle cx="0" cy="86" r="8" fill="#c49a6c"/>
  </g>
  <!-- Right sword (phantom blade) - silver/grey, pointing upper-left, ghostly -->
  <g transform="translate(256, 256) rotate(45)">
    <!-- Blade -->
    <rect x="-8" y="-180" width="16" height="200" rx="2" fill="url(#phantomGrad)" filter="url(#ghostGlow)"/>
    <!-- Blade edge highlight -->
    <rect x="-6" y="-180" width="3" height="200" rx="1" fill="#e0e0e0" opacity="0.4"/>
    <!-- Guard -->
    <rect x="-22" y="20" width="44" height="6" rx="2" fill="#a0a0a0" opacity="0.5"/>
    <!-- Handle -->
    <rect x="-5" y="26" width="10" height="55" rx="2" fill="#3a3a3a" opacity="0.5"/>
    <!-- Pommel -->
    <circle cx="0" cy="86" r="8" fill="#a0a0a0" opacity="0.5"/>
  </g>
  <!-- Subtle crimson dot at crossing point -->
  <circle cx="256" cy="256" r="6" fill="#8B0000" filter="url(#glow)" opacity="0.7"/>
</svg>
